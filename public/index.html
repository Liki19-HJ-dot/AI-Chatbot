<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open AI Chat</title>
<meta name="description" content="Ask anything, get answers, and generate images with AI.">
<meta name="theme-color" content="#6d5efc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236d5efc'/%3E%3Ctext x='50' y='66' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EAI%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f6fa;
    --surface-2: #eceef5;
    --text: #15171f;
    --muted: #6b7080;
    --border: #e1e4ee;
    --accent: #6d5efc;
    --accent-text: #ffffff;
    --user-bg: #6d5efc;
    --user-text: #ffffff;
    --code-bg: #14161f;
    --code-text: #e8eaf5;
    --danger: #d1344a;
    --shadow: 0 6px 24px rgba(30, 30, 70, 0.08);
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #171a23;
    --surface-2: #20242f;
    --text: #eceef7;
    --muted: #9aa0b4;
    --border: #272b38;
    --accent: #8b7dff;
    --user-bg: #5b4de0;
    --danger: #ff6b81;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
  img, video { max-width: 100%; height: auto; }
  .bubble table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #6d5efc, #22d3ee);
    color: #fff; font-weight: 800; font-size: 14px;
    display: grid; place-items: center; flex: none;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  .hbtn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .hbtn:hover { background: var(--surface-2); }
  .hbtn:focus-visible, .chip:focus-visible, #send:focus-visible, .example:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- Messages ---------- */
  #scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  #messages { max-width: 780px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 18px; }

  .welcome { text-align: center; padding: 8vh 8px 0; }
  .welcome .logo { width: 56px; height: 56px; border-radius: 16px; font-size: 22px; margin: 0 auto 14px; }
  .welcome h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .welcome p { color: var(--muted); margin: 0 0 22px; }
  .examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; text-align: left; }
  .example {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 14.5px; cursor: pointer; text-align: left;
  }
  .example:hover { background: var(--surface-2); }
  .example small { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 2px; }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 100%; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user .bubble {
    background: var(--user-bg); color: var(--user-text);
    padding: 10px 14px; border-radius: 18px 18px 4px 18px; max-width: 85%; white-space: pre-wrap;
  }
  .msg.assistant .bubble { width: 100%; }
  .msg.assistant .bubble > :first-child { margin-top: 0; }
  .msg.assistant .bubble > :last-child { margin-bottom: 0; }
  .bubble p { margin: 0 0 10px; }
  .bubble h2, .bubble h3, .bubble h4, .bubble h5 { margin: 16px 0 6px; line-height: 1.3; }
  .bubble h2 { font-size: 1.25em; } .bubble h3 { font-size: 1.12em; } .bubble h4, .bubble h5 { font-size: 1em; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble a { color: var(--accent); }
  .bubble code {
    background: var(--surface-2); padding: 1px 6px; border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em;
  }
  .code { margin: 10px 0; border-radius: 12px; overflow: hidden; background: var(--code-bg); }
  .code-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; background: rgba(255,255,255,0.07); color: #aab0c8; font-size: 12.5px;
  }
  .copy { background: transparent; border: 0; color: #cfd3e8; cursor: pointer; font: inherit; font-size: 12.5px; padding: 2px 6px; border-radius: 6px; }
  .copy:hover { background: rgba(255,255,255,0.12); }
  .code pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
  .code pre code { background: none; padding: 0; color: var(--code-text); font-size: 13.5px; white-space: pre; }

  .gen-image { margin-top: 10px; }
  .gen-image img { display: block; width: min(100%, 520px); max-width: 100%; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
  .gen-image a { display: inline-block; margin-top: 6px; font-size: 13.5px; color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .sources { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .sources a { display: inline-block; margin: 2px 8px 2px 0; color: var(--accent); }
  .error-bubble {
    border: 1px solid var(--danger); color: var(--danger); background: transparent;
    padding: 10px 14px; border-radius: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .error-bubble button {
    border: 1px solid var(--danger); background: transparent; color: var(--danger);
    border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 14px;
  }

  .typing { display: inline-flex; gap: 5px; padding: 8px 2px; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; } .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
  .typing-label { color: var(--muted); font-size: 13.5px; margin-left: 8px; align-self: center; }

  /* ---------- Composer ---------- */
  footer { padding: 6px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
  .composer-wrap { max-width: 780px; margin: 0 auto; }
  .modes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 24px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow);
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font: inherit; line-height: 1.45; padding: 8px 0; max-height: 200px; min-height: 28px;
  }
  textarea::placeholder { color: var(--muted); }
  #send {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; transition: transform 0.12s ease, opacity 0.12s ease;
  }
  #send:hover:not(:disabled) { transform: scale(1.06); }
  #send:disabled { opacity: 0.35; cursor: not-allowed; }
  #send svg { width: 20px; height: 20px; }
  .fine { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .fine a { color: var(--muted); }

    @media (max-width: 560px) {
    .welcome { padding-top: 4vh; }
    .welcome h2 { font-size: 22px; }
    header { padding: 8px 12px; gap: 8px; }
    header h1 { font-size: 16px; }
    .hbtn { padding: 6px 10px; font-size: 13px; }
    #messages { padding: 14px 12px 6px; }
    .msg.user .bubble { max-width: 92%; }
    footer { padding-left: 12px; padding-right: 12px; }
  }
  @media (max-width: 360px) {
    header h1 { font-size: 15px; }
    #themeBtn { display: none; }
    .chip { padding: 4px 9px; font-size: 12px; }
  }
  @media (min-width: 1280px) {
    body { font-size: 17px; }
    #messages, .composer-wrap { max-width: 860px; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    .welcome { padding-top: 1vh; }
    .welcome .logo { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header>
  <div class="logo" aria-hidden="true">AI</div>
  <h1>Open AI Chat</h1>
  <div class="spacer"></div>
  <button class="hbtn" id="themeBtn" type="button" aria-label="Toggle light and dark theme">Theme</button>
  <button class="hbtn" id="newBtn" type="button" aria-label="Start a new chat">+ New chat</button>
</header>

<div id="scroll">
  <main id="messages" aria-live="polite"></main>
</div>

<footer>
  <div class="composer-wrap">
    <div class="modes" role="group" aria-label="Answer style">
      <button class="chip" type="button" data-mode="auto" aria-pressed="true" title="Chats, and makes an image when you ask for one">Auto</button>
      <button class="chip" type="button" data-mode="search" aria-pressed="false" title="Searches the web for current facts">Web search</button>
      <button class="chip" type="button" data-mode="creative" aria-pressed="false" title="Captions, scripts, ideas">Creative</button>
      <button class="chip" type="button" data-mode="image" aria-pressed="false" title="Always generate an image">Image</button>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" maxlength="4000" placeholder="Ask anything, or say &quot;generate an image of…&quot;" aria-label="Message"></textarea>
      <button id="send" type="button" aria-label="Send message" title="Send (Enter)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <p class="fine">AI can make mistakes, so check important info. Contact: <a href="mailto:19likhith@gmail.com">19likhith@gmail.com</a></p>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var STORE_KEY = "openAiChat:v1";
  var THEME_KEY = "openAiChat:theme";
  var EXAMPLES = [
    { tag: "Explain", text: "Explain how the internet works in simple words" },
    { tag: "Code", text: "Write a JavaScript function that removes duplicates from an array" },
    { tag: "Image", text: "Generate an image of a cozy cabin in the snow at sunset" },
    { tag: "Creative", text: "Write 3 catchy Instagram captions for a coffee shop" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var messagesEl = $("messages"), scrollEl = $("scroll"), input = $("input"), sendBtn = $("send");
  var messages = [];       // [{role, content, image?, sources?, mock?, hadImage?}]
  var mode = "auto";
  var busy = false;
  var failed = null;       // error message for the last failed request

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function inline(s) {
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  }
  // Small, safe Markdown renderer: everything is HTML-escaped first.
  function renderMarkdown(text) {
    var blocks = [];
    var t = String(text).replace(/```([\w+-]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
      blocks.push({ lang: lang, code: code.replace(/\n$/, "") });
      return "\u0000B" + (blocks.length - 1) + "\u0000";
    });
    t = esc(t);
    var lines = t.split("\n"), html = "", list = null, para = [];
    function closeList() { if (list) { html += "</" + list + ">"; list = null; } }
    function flush() { if (para.length) { html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } }
    lines.forEach(function (line) {
      var m;
      if (/^\u0000B\d+\u0000$/.test(line.trim())) { flush(); closeList(); html += line.trim(); return; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flush(); closeList(); var n = m[1].length + 1; html += "<h" + n + ">" + inline(m[2]) + "</h" + n + ">"; return; }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flush(); if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; return; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flush(); if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; return; }
      if (!line.trim()) { flush(); closeList(); return; }
      closeList(); para.push(line);
    });
    flush(); closeList();
    return html.replace(/\u0000B(\d+)\u0000/g, function (m, i) {
      var b = blocks[+i];
      return '<div class="code"><div class="code-head"><span>' + esc(b.lang || "code") +
        '</span><button class="copy" type="button">Copy</button></div><pre><code>' + esc(b.code) + "</code></pre></div>";
    });
  }
  function safeImageSrc(src) {
    return typeof src === "string" && /^(data:image\/(png|jpeg|webp|gif|svg\+xml);base64,|https:\/\/)/i.test(src) ? src : "";
  }

  /* ---------- storage (text only; images are not saved) ---------- */
  function save() {
    try {
      var slim = messages.slice(-60).map(function (m) {
        return { role: m.role, content: m.content, sources: m.sources, mock: m.mock, hadImage: !!(m.image || m.hadImage) };
      });
      localStorage.setItem(STORE_KEY, JSON.stringify(slim));
    } catch (e) { /* storage may be unavailable; the chat still works */ }
  }
  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      if (Array.isArray(raw)) messages = raw.filter(function (m) { return m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string"; });
    } catch (e) { messages = []; }
  }

  /* ---------- rendering ---------- */
  function scrollDown() { scrollEl.scrollTop = scrollEl.scrollHeight; }

  function render() {
    messagesEl.innerHTML = "";
    if (!messages.length && !busy && !failed) { renderWelcome(); return; }
    messages.forEach(function (m) { messagesEl.appendChild(renderMessage(m)); });
    if (busy) messagesEl.appendChild(renderTyping());
    if (failed && !busy) messagesEl.appendChild(renderError());
    scrollDown();
  }
  function renderWelcome() {
    var w = document.createElement("div");
    w.className = "welcome";
    w.innerHTML = '<div class="logo" aria-hidden="true">AI</div><h2>How can I help today?</h2>' +
      "<p>Ask a question, get code or ideas, search the web, or generate an image.</p>";
    var grid = document.createElement("div");
    grid.className = "examples";
    EXAMPLES.forEach(function (ex) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "example";
      b.innerHTML = "<small>" + esc(ex.tag) + "</small>" + esc(ex.text);
      b.addEventListener("click", function () { send(ex.text); });
      grid.appendChild(b);
    });
    w.appendChild(grid);
    messagesEl.appendChild(w);
  }
  function renderMessage(m) {
    var row = document.createElement("div");
    row.className = "msg " + m.role;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (m.role === "user") {
      bubble.textContent = m.content;
    } else {
      bubble.innerHTML = renderMarkdown(m.content);
      var src = safeImageSrc(m.image);
      if (src) {
        var wrap = document.createElement("div");
        wrap.className = "gen-image";
        var img = document.createElement("img");
        img.src = src; img.alt = "Generated image";
        var dl = document.createElement("a");
        dl.href = src; dl.textContent = "Download image";
        dl.download = "ai-image" + (/svg/.test(src) ? ".svg" : ".png");
        wrap.appendChild(img); wrap.appendChild(dl);
        bubble.appendChild(wrap);
      } else if (m.hadImage) {
        var n = document.createElement("div");
        n.className = "note";
        n.textContent = "(The image isn't saved after you reload the page.)";
        bubble.appendChild(n);
      }
      if (Array.isArray(m.sources) && m.sources.length) {
        var s = document.createElement("div");
        s.className = "sources";
        s.appendChild(document.createTextNode("Sources: "));
        m.sources.forEach(function (x) {
          if (!/^https?:\/\//i.test(x.url || "")) return;
          var a = document.createElement("a");
          a.href = x.url; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = x.title || x.url;
          s.appendChild(a);
        });
        bubble.appendChild(s);
      }
    }
    row.appendChild(bubble);
    return row;
  }
  function renderTyping() {
    var row = document.createElement("div");
    row.className = "msg assistant";
    var label = (mode === "image" || (mode === "auto" && looksLikeImage(lastUser()))) ? "Creating your image…" : "Thinking…";
    row.innerHTML = '<div class="bubble"><span class="typing" aria-hidden="true"><span></span><span></span><span></span></span>' +
      '<span class="typing-label">' + label + "</span></div>";
    return row;
  }
  function renderError() {
    var row = document.createElement("div");
    row.className = "msg assistant";
    var box = document.createElement("div");
    box.className = "error-bubble";
    box.setAttribute("role", "alert");
    var t = document.createElement("span");
    t.textContent = failed;
    var btn = document.createElement("button");
    btn.type = "button"; btn.textContent = "Try again";
    btn.addEventListener("click", function () { request(); });
    box.appendChild(t); box.appendChild(btn);
    row.appendChild(box);
    return row;
  }
  function lastUser() {
    for (var i = messages.length - 1; i >= 0; i--) if (messages[i].role === "user") return messages[i].content;
    return "";
  }
  function looksLikeImage(t) {
    return /\b(generate|create|make|draw|design|paint|produce|render|sketch|illustrate|imagine)\b[^.!?\n]{0,40}\b(image|picture|photo|illustration|logo|poster|banner|wallpaper|icon|drawing|painting|portrait|cartoon|graphic)\b/i.test(t || "") || /^\s*\/(image|imagine|img|draw)\b/i.test(t || "");
  }

  /* ---------- sending ---------- */
  function setBusy(v) {
    busy = v;
    input.disabled = v;
    updateSend();
  }
  function updateSend() { sendBtn.disabled = busy || !input.value.trim(); }

  function send(text) {
    text = String(text || "").trim();
    if (!text || busy) return;
    messages.push({ role: "user", content: text });
    input.value = ""; autosize(); updateSend();
    save();
    request();
  }

  function request() {
    if (busy) return;
    failed = null;
    setBusy(true);
    render();

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 130000);
    var payload = {
      mode: mode,
      messages: messages.map(function (m) { return { role: m.role, content: m.content }; })
    };

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");
        return data;
      });
    }).then(function (data) {
      messages.push({ role: "assistant", content: data.reply || "(No reply)", image: data.image, sources: data.sources, mock: data.mock });
      save();
    }).catch(function (err) {
      failed = err && err.name === "AbortError"
        ? "That took too long. Please try again."
        : (err && err.message && err.message !== "Failed to fetch" ? err.message : "Couldn't reach the server. Check your connection and try again.");
    }).then(function () {
      clearTimeout(timer);
      setBusy(false);
      render();
      input.focus();
    });
  }

  /* ---------- events ---------- */
  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }
  input.addEventListener("input", function () { autosize(); updateSend(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });
  sendBtn.addEventListener("click", function () { send(input.value); });

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      mode = chip.getAttribute("data-mode");
      document.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", String(c === chip)); });
      input.focus();
    });
  });

  messagesEl.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest(".copy");
    if (!btn) return;
    var code = btn.closest(".code").querySelector("code").textContent;
    var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, function () {});
    else {
      var ta = document.createElement("textarea"); ta.value = code; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (x) {} document.body.removeChild(ta);
    }
  });

  $("newBtn").addEventListener("click", function () {
    if (busy) return;
    messages = []; failed = null; save(); render(); input.focus();
  });

  function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); }
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  })();
  $("themeBtn").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* ---------- start ---------- */
  load();
  render();
  updateSend();
  input.focus();
})();
</script>
</body>
</html>
